spring:
  datasource:
    # Same as production: the schema relies on foreign keys (set null, cascade).
    url: "jdbc:sqlite::memory:?foreign_keys=true"
    hikari:
      maximum-pool-size: 1
      # An in-memory SQLite database disappears with its connection, so never retire it.
      max-lifetime: 0

app:
  auth:
    password: testpass
    secure-cookies: false
  calendar:
    mode: fake
    # Tests refresh by hand; a background refresh must not change the data mid-test.
    initial-delay: PT1H
  weather:
    initial-delay: PT1H
  speech:
    # Tests count what the speech service is asked to say.
    warm-phrases: false
